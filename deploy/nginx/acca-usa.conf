# Nginx site for ACCA USA. Replace example.com with your domain, copy to /etc/nginx/sites-available/acca-usa.conf and enable it.
# Full walk-through: docs/VPS_DEPLOYMENT.md. Not validated against a real server from the repository (needs `nginx -t` on the VPS).
#
# Certificates: first enable only the port-80 server block (comment out the 443 block), run
#   sudo certbot --nginx -d example.com -d www.example.com
# certbot then fills in the ssl_* lines and sets up automatic renewal.

# http{} level (this file is included inside it by sites-enabled): a small request-rate zone for the sign-in pages.
limit_req_zone $binary_remote_addr zone=acca_auth:10m rate=30r/m;

upstream acca_web {
    server 127.0.0.1:3000;          # `next start -H 127.0.0.1 -p 3000` — the app must NOT listen on a public address
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://example.com$request_uri; }
}

server {
    # `http2` on the listen line works on Ubuntu 24.04's nginx 1.24 and newer (newer versions only print a deprecation notice).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;   # written by certbot
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    # HSTS is sent by the application itself in production mode (next.config.ts).

    server_tokens off;

    # Compression is done here (the Node process has compression off): HTML / JSON / JS / CSS only — never video or PDF.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ── uploads ───────────────────────────────────────────────────────────────
    # The largest accepted body is 160 MB (src/app/api/uploads/route.ts, video cap 150 MB + multipart overhead).
    # The app enforces the real per-type limits; Nginx only has to let a legitimate body through and stop absurd ones early.
    client_max_body_size 170m;
    client_body_timeout 300s;             # slow phone connections uploading a lecture video
    proxy_request_buffering off;          # stream the body to the app instead of spooling it to /var/lib/nginx first (no 2x disk use)
    proxy_buffering on;                   # responses are buffered normally

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # OVERWRITE, never append: the app trusts the first X-Forwarded-For entry for rate limits and the audit log,
    # so a client-supplied header must not survive.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Health probe from the VPS itself only (monitoring should use https://example.com/api/health from outside).
    location = /api/health {
        proxy_pass http://acca_web;
        access_log off;
    }

    # Optional offload (FILE_DELIVERY=nginx in the app's env): after the app has checked access it answers with X-Accel-Redirect and Nginx
    # streams the file from the private bucket itself, so video never passes through Node. Replace 127.0.0.1:9000 with your S3_ENDPOINT
    # (host:port, plain http on loopback for MinIO). `internal` = reachable ONLY through that header, never directly by a browser.
    location /_s3/ {
        internal;
        rewrite ^/_s3/(.*)$ /$1 break;                 # keeps the signed query string
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host 127.0.0.1:9000;          # must equal the host the URL was signed for (S3_ENDPOINT)
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # Streaming video / PDF with Range requests: never buffer a whole file to disk.
    location ~ ^/api/(files|media)/ {
        proxy_pass http://acca_web;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Brute-force damping in front of the application's own rate limits.
    location ~ ^/(login|register|forgot-password|reset-password) {
        limit_req zone=acca_auth burst=10 nodelay;
        proxy_pass http://acca_web;
    }

    location / {
        proxy_pass http://acca_web;
    }
}
